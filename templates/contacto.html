{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Información de Contacto</h2>
                
                <div class="list-group list-group-flush">
                    <div class="list-group-item d-flex align-items-center">
                        <i class="bi bi-geo-alt-fill text-primary fs-3 me-3"></i>
                        <div>
                            <h6 class="mb-0">Dirección</h6>
                            <p class="mb-0 text-muted">Av. de la Tecnología 123, Ciudad Digital</p>
                        </div>
                    </div>
                    <div class="list-group-item d-flex align-items-center">
                        <i class="bi bi-telephone-fill text-primary fs-3 me-3"></i>
                        <div>
                            <h6 class="mb-0">Teléfono</h6>
                            <p class="mb-0 text-muted">+1 (555) 123-4567</p>
                        </div>
                    </div>
                    <div class="list-group-item d-flex align-items-center">
                        <i class="bi bi-envelope-fill text-primary fs-3 me-3"></i>
                        <div>
                            <h6 class="mb-0">Correo Electrónico</h6>
                            <p class="mb-0 text-muted">contacto@portalservicios.com</p>
                        </div>
                    </div>
                </div>

                <div class="mt-4 text-center">
                    <button class="btn btn-outline-primary"><i class="bi bi-chat-dots"></i> Enviar Mensaje</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
